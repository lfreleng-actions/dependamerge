name: 'CodeQL'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']
    paths-ignore:
      - '.github/**'
      - 'docs/**'
  schedule:
    - cron: '40 4 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    name: 'CodeQL'
    permissions:
      contents: read  # checkout
      security-events: write  # upload results to code scanning
      packages: read  # fetch internal or private CodeQL packs
      actions: read  # the upload reads run info on private repositories
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/codeql.yaml@378fcc19ebdf37f17fde4888d4b71c83b21d6cf3  # v0.9.7
    with:
      languages: 'python,actions'
      config_file: '.github/codeql/codeql-config.yml'
