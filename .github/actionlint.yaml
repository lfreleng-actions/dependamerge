# Path-specific actionlint configuration, read by the kjanat/actionlint
# fork pinned in .pre-commit-config.yaml.
paths:
  .github/workflows/testing.yaml:
    ignore:
      # GitHub's self-repository 'uses: $/...' syntax (July 2026) is what
      # zizmor's self-repository audit asks for in place of './'. The
      # fork understands '$/{path}' but rejects a bare '$/', because
      # actions/runner's TryParseSelfRepository helper refuses an empty
      # path. GitHub's workflow parser accepts it: an action at the
      # repository root has no {path}, and a bare '$/' resolves and
      # runs. The closing quote sits immediately after '$/', so a
      # malformed form such as '$//' is still reported.
      - 'specifying action "\$/" in invalid format because path is missing'

  .github/workflows/dependamerge.yaml:
    ignore:
      # As for testing.yaml: the reusable workflow runs the action at
      # the repository root through a bare '$/'.
      - 'specifying action "\$/" in invalid format because path is missing'
